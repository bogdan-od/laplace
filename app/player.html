<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23222%27/%3E%3Cpath d=%27M3 5l4 3-4 3M8 12h5%27 stroke=%27%2380e080%27 stroke-width=%271.6%27 fill=%27none%27/%3E%3C/svg%3E">
<title>Повтор і розбір журналу</title>
<link rel="stylesheet" href="../vendor/xterm.css">
<style>
    body { background: #111; color: #ccc; font-family: sans-serif; margin: 20px; }
    fieldset { border: 0; margin: 0; padding: 0; }
    button { background: #234; color: #cde; border: 1px solid #456; padding: 4px 10px; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    button.on { background: #357; }
    .bar { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; font-size: 14px; flex-wrap: wrap; }
    #head { font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
    #parent { color: #9cf; }
    #timeline_box { position: relative; width: 760px; margin: 6px 0 14px; }
    #timeline { width: 100%; }
    #marks { position: absolute; top: 14px; left: 0; right: 0; height: 8px; pointer-events: none; }
    .mark { position: absolute; top: 0; width: 2px; height: 8px; background: #9c9; }
    #body { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
    #terminal { width: 880px; flex: none; }
    #cmds { flex: 0 0 300px; height: 620px; overflow: auto; font-family: monospace; font-size: 13px; }
    #search { width: 100%; box-sizing: border-box; background: #1a1a1a; color: #ccc; border: 1px solid #456; padding: 4px; }
    #list { list-style: none; padding: 0; margin: 6px 0 0; }
    #list li { padding: 2px 4px; cursor: pointer; white-space: pre-wrap; }
    #list li:hover { background: #222; }
    #list li.cur { background: #353; color: #efe; }
    .live #cmds { pointer-events: none; opacity: .4; }
    #lesson_marks { position: absolute; top: 24px; left: 0; right: 0; height: 8px; pointer-events: none; }
    .lmark { position: absolute; top: 0; height: 8px; min-width: 3px; background: #6af; }
    .lmark.self { background: #fa4; opacity: .8; }
    #markup { margin: 0 0 8px; }
    #lesson_text { width: 360px; background: #1a1a1a; color: #ccc; border: 1px solid #456; padding: 4px; }
    #lesson_items { list-style: none; padding: 0; margin: 6px 0; }
    #lesson_items li { padding: 2px 4px; cursor: pointer; white-space: pre-wrap; color: #fc8; }
    #lesson_items li.note { color: #8cf; }
    #lesson_items li button { padding: 0 6px; margin-left: 6px; }
    .lesson .teacher-only { display: none !important; }
    #lesson_note { background: #223; color: #cde; border-left: 4px solid #6af; padding: 8px 12px; margin: 0 0 8px; width: 856px; white-space: pre-wrap; }
    #lesson_task { background: #321; color: #fdb; border-left: 4px solid #fa4; padding: 8px 12px; margin: 0 0 8px; width: 856px; }
    #lesson_task_text { white-space: pre-wrap; margin-bottom: 8px; }
    #err { color: #f77; font-weight: bold; min-height: 1em; }
    #note { font-size: 13px; color: #9c9; min-height: 1em; margin: 6px 0; }
    #verify_result { color: #9c9; }
</style>
<div id="head">
    <div>Профіль: <b id="profile"></b> · машина: <b id="machine"></b> · запис: <span id="recorded"></span></div>
    <div>Подій: <b id="count"></b> · тривалість: <b id="duration"></b></div>
    <div id="parent" hidden></div>
</div>
<div class="bar">
    <span>Файл: <input type="file" id="file" accept=".json,application/json"></span>
    <span>Режим: <b id="mode">-</b></span>
    <span>час гостя <b id="vt">0.0</b> с</span>
    <span>подія <b id="ev">0</b></span>
    <span id="err"></span>
</div>
<fieldset id="replay" class="bar teacher-only" disabled>
    <span>швидкість:
        <button data-speed="1">1×</button><button data-speed="4">4×</button><button data-speed="0">макс</button></span>
    <button id="play">Пауза</button>
    <div id="timeline_box">
        <input type="range" id="timeline" min="0" step="0.5" value="0">
        <div id="marks"></div>
        <div id="lesson_marks"></div>
    </div>
</fieldset>
<fieldset id="markup" class="bar teacher-only" disabled>
    <input id="lesson_text" placeholder="Текст пояснення або завдання">
    <button id="mark_note">Пояснення тут</button>
    <button id="mark_from">Сам: початок</button>
    <button id="mark_to">Сам: кінець</button>
    <button id="save_lesson">Зберегти урок</button>
    <span id="lesson_pending"></span>
</fieldset>
<div class="bar teacher-only">
    <button id="go_live" disabled>Продовжити звідси</button>
    <button id="save" hidden>Зберегти журнал</button>
    <button id="verify" disabled>Перевірити</button>
    <span id="verify_result"></span>
</div>
<div id="note">Оберіть журнал або перетягніть його сюди.</div>
<div id="lesson_note" hidden></div>
<div id="lesson_task" hidden>
    <div id="lesson_task_text"></div>
    <button id="lesson_retry">Спробувати знову</button>
    <button id="lesson_solution">Показати розв'язок</button>
    <button id="lesson_next">Далі</button>
</div>
<div id="body">
    <div id="terminal"></div>
    <aside id="cmds" class="teacher-only">
        <ul id="lesson_items"></ul>
        <input id="search" placeholder="Пошук команд">
        <ul id="list"></ul>
    </aside>
</div>
<script src="../vendor/xterm.js"></script>
<script type="module" src="ui/player.mjs"></script>
